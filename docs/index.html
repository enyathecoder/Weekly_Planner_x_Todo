<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="prev" aria-label="Previous week">‹</button>
  <button id="today">Today</button>
  <button id="next" aria-label="Next week">›</button>
  <input type="date" id="jump" aria-label="Jump to date">
  <span id="hid"></span><span class="sp"></span>
  <button id="rev">Review</button><button id="cp">Copy to next week</button><button id="imp">Import</button><button id="exp">Export</button><button id="set">Settings</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<div id="chips"></div>
<main>
  <div class="cal" id="cal"></div>
  <aside id="aside"></aside>
</main>

<dialog id="ed"><form id="f" method="dialog">
  <label class="w">Title<input name="title" autocomplete="off"></label>
  <label>Category<select name="cat"></select></label>
  <label>Date<input type="date" name="date" required></label>
  <label>Start<input type="time" name="st" required></label>
  <label>End<input type="time" name="en" required></label>
  <label>Repeat<select name="rep"><option value="">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>
  <label>Repeat until<input type="date" name="until"></label>
  <label class="w">Location<input name="loc" autocomplete="off"></label>
  <label class="w">Notes<textarea name="notes" rows="2"></textarea></label>
  <div class="row">
    <button type="button" class="dg" id="delA">Delete</button>
    <button type="button" class="dg" id="del1">Delete this one</button>
    <span class="sp"></span>
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" class="pri">Save</button>
  </div>
</form></dialog>

<dialog id="st"><form id="sf" method="dialog">
  <label class="w">Display time zone<select name="tz"></select></label>
  <label>Snap to<select name="snap"><option>5</option><option>10</option><option>15</option><option>30</option><option>60</option></select></label>
  <label>Row height<select name="dens"><option value="44">Compact</option><option value="56">Standard</option><option value="76">Roomy</option></select></label>
  <label>First hour<input type="number" name="h0" min="0" max="22"></label>
  <label>Last hour<input type="number" name="h1" min="1" max="24"></label>
  <div class="row"><button class="pri">Done</button></div>
</form></dialog>

<dialog id="td2"><form id="tf" method="dialog">
  <label class="w">Task<input name="title" autocomplete="off"></label>
  <label>Category<select name="cat"></select></label>
  <label>Duration<select name="dur"></select></label>
  <label class="w">Week of<input type="date" name="wk" required></label>
  <label class="w">Location<input name="loc" autocomplete="off"></label>
  <div class="row"><button type="button" class="dg" id="tdel">Delete</button><span class="sp"></span><button type="button" id="tcancel">Cancel</button><button type="submit" class="pri">Save</button></div>
</form></dialog>

<dialog id="cf"><form method="dialog">
  <p id="cfm" style="margin:0 0 14px;grid-column:1/3"></p>
  <div class="row"><button value="no">Cancel</button><button value="yes" class="pri" id="cfy">Delete</button></div>
</form></dialog>

<dialog id="rv"><div id="rvb"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="pri" id="rvx">Close</button></div></dialog>

<dialog id="sc"><form method="dialog">
  <p style="margin:0 0 14px;grid-column:1/3">This is a repeating event. Apply your changes to:</p>
  <div class="row"><button value="no">Cancel</button><button value="one">Only this event</button><button value="all" class="pri">All future events</button></div>
</form></dialog>

<script src="app.js"></script>
</body>
</html>
